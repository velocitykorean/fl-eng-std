name: English Fluency Studio - Daily Podcast Generator

on:
  # Schedule: Generate and upload 1 podcast per day at 10 PM EST (3 AM UTC next day)
  schedule:
    - cron: '0 3 * * *'  # 10:00 PM EST (3:00 AM UTC next day)

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic index (0-9, random if empty)'
        required: false
        default: ''
      turns:
        description: 'Number of turns (default: 130 for ~30 min)'
        required: false
        default: '130'

jobs:
  generate-podcast:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-freefont-ttf
          echo "✅ System dependencies installed"
          sudo fc-cache -fv
          echo "✅ Font cache refreshed"

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ All dependencies installed"

      - name: 🔐 Create .env file from secrets
        run: |
          echo "POLLINATIONS_API_KEY=${{ secrets.POLLINATIONS_API_KEY }}" >> .env
          echo "AI_MODEL=${{ secrets.AI_MODEL || 'gemini-fast' }}" >> .env
          echo "" >> .env
          echo "# YouTube API Credentials" >> .env
          echo "YT_CLIENT_ID=${{ secrets.YT_CLIENT_ID }}" >> .env
          echo "YT_CLIENT_SECRET=${{ secrets.YT_CLIENT_SECRET }}" >> .env
          echo "YT_REFRESH_TOKEN=${{ secrets.YT_REFRESH_TOKEN }}" >> .env
          echo "✅ .env file created"

      - name: 🎙️ Generate 30-Minute Podcast Video
        id: generate
        run: |
          echo "🚀 Starting English Fluency Studio podcast generation..."
          echo "⏱️  This will take approximately 15-25 minutes..."
          echo ""

          # Determine topic and turns
          TOPIC_INDEX="${{ github.event.inputs.topic }}"
          TURNS="${{ github.event.inputs.turns }}"

          if [ -z "$TOPIC_INDEX" ]; then
            # Random topic selection
            TOPIC_INDEX=$(python -c "import random; print(random.randint(0, 9))")
            echo "🎲 Random topic selected: index $TOPIC_INDEX"
          fi

          if [ -z "$TURNS" ]; then
            TURNS=130
          fi

          echo "📝 Topic index: $TOPIC_INDEX"
          echo "🎙️  Target turns: $TURNS (~30 minutes)"

          # Run the podcast generator with specific topic
          python -c "
          import asyncio
          from podcast_generator import run_full_generator
          asyncio.run(run_full_generator(topic_index=$TOPIC_INDEX, custom_turns=$TURNS))
          "

          echo ""
          echo "✅ Podcast generation complete!"
          echo ""

          # Find the latest output directory
          LATEST_DIR=$(ls -td output/run_*/ | head -1)
          echo "LATEST_PODCAST_DIR=$LATEST_DIR" >> $GITHUB_OUTPUT
          echo "📁 Output directory: $LATEST_DIR"

          # Get video duration
          if [ -f "${LATEST_DIR}podcast_30min_final.mp4" ]; then
            DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "${LATEST_DIR}podcast_30min_final.mp4" 2>/dev/null || echo "Unknown")
            echo "VIDEO_DURATION=$DURATION" >> $GITHUB_OUTPUT
            echo "⏱️  Video duration: $DURATION seconds"
          fi

      - name: 📋 Generate YouTube Metadata
        id: metadata
        run: |
          LATEST_DIR="${{ steps.generate.outputs.LATEST_PODCAST_DIR }}"

          # Generate YouTube upload metadata
          python -c "
          import json, os, random
          from pathlib import Path

          run_dir = Path('$LATEST_DIR')
          script_file = run_dir / 'script.json'

          if script_file.exists():
              with open(script_file) as f:
                  data = json.load(f)
              topic = data.get('topic', {})
              topic_name = topic.get('topic', 'American English Fluency')
              keyword = topic.get('keyword', 'FLUENCY')
          else:
              topic_name = 'American English Fluency'
              keyword = 'FLUENCY'

          ep_num = random.randint(1, 999)

          titles = [
              f'Slow American English Podcast - {topic_name} | Episode {ep_num}',
              f'Learn American English - {topic_name} | Speak Fluently',
              f'English Fluency Studio - {topic_name} | Slow & Clear',
              f'Master American English - {topic_name} | Daily Podcast',
          ]

          description = f'''🎙️ English Fluency Studio Podcast - Episode {ep_num}

In this episode, we discuss: {topic_name}

This is a slow, clear American English podcast designed for English learners. Two hosts (Emma and Andrew) have a natural conversation at a pace that's easy to follow.

🎯 WHAT YOU'LL LEARN:
• Natural American English expressions
• Slow, clear pronunciation
• Real conversational English
• Everyday vocabulary and phrases

💡 HOW TO USE THIS PODCAST:
1. Listen actively while reading the text on screen
2. Pause and repeat phrases out loud
3. Practice shadowing (speak along with the hosts)
4. Listen multiple times for better retention

🔔 SUBSCRIBE for daily slow English podcasts!
👍 LIKE this video if you found it helpful!
💬 COMMENT which topics you want us to cover next!

📱 FOLLOW ENGLISH FLUENCY STUDIO:
[Add your social media links here]

#EnglishFluency #LearnEnglish #AmericanEnglish #SlowEnglish #EnglishPodcast #SpeakEnglish #EnglishListening #EnglishPractice #FluencyStudio #EnglishVocabulary

---
© English Fluency Studio - Making English learning accessible to everyone!
'''

          tags = [
              'Learn English',
              'American English',
              'English Fluency',
              'Slow English',
              'English Podcast',
              'Speak English',
              'English Listening',
              'English Practice',
              'English Vocabulary',
              'Language Learning',
              'English for Beginners',
              'Fluency Studio'
          ]

          metadata = {
              'titles': titles,
              'selected_title': titles[0],
              'description': description,
              'tags': tags,
              'topic': topic_name,
              'keyword': keyword,
              'episode': ep_num
          }

          with open(run_dir / 'youtube_metadata.json', 'w') as f:
              json.dump(metadata, f, indent=2)

          print(f'Title: {titles[0]}')
          print(f'Topic: {topic_name}')
          print(f'Episode: {ep_num}')
          "

          echo "✅ YouTube metadata generated"

      - name: 📺 Upload to YouTube (Video + Thumbnail + Metadata)
        id: youtube-upload
        continue-on-error: true
        run: |
          echo "🚀 Starting automatic YouTube upload..."

          LATEST_DIR="${{ steps.generate.outputs.LATEST_PODCAST_DIR }}"
          echo "📁 Podcast directory: $LATEST_DIR"

          # Verify required files exist
          if [ ! -f "${LATEST_DIR}podcast_30min_final.mp4" ]; then
            echo "❌ Video file not found: ${LATEST_DIR}podcast_30min_final.mp4"
            echo "upload_success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Set environment variables for YouTube upload
          export YT_CLIENT_ID="${{ secrets.YT_CLIENT_ID }}"
          export YT_CLIENT_SECRET="${{ secrets.YT_CLIENT_SECRET }}"
          export YT_REFRESH_TOKEN="${{ secrets.YT_REFRESH_TOKEN }}"

          # Verify credentials are set
          if [ -z "$YT_CLIENT_ID" ] || [ -z "$YT_CLIENT_SECRET" ] || [ -z "$YT_REFRESH_TOKEN" ]; then
            echo "❌ YouTube credentials not set! Please add YT_CLIENT_ID, YT_CLIENT_SECRET, and YT_REFRESH_TOKEN to GitHub Secrets."
            echo "upload_success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ YouTube credentials verified"

          # Add upload directory to PYTHONPATH
          export PYTHONPATH="${{ github.workspace }}/upload:$PYTHONPATH"

          # Run the YouTube upload script
          cd upload
          python upload_youtube_longform.py
          upload_exit_code=$?

          if [ $upload_exit_code -ne 0 ]; then
            echo "❌ YouTube upload failed with exit code $upload_exit_code"
            echo "upload_success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ YouTube upload step complete!"

          # Check if upload result file was created
          if [ -f "${LATEST_DIR}youtube_upload_result.json" ]; then
            echo "📄 Upload result:"
            cat "${LATEST_DIR}youtube_upload_result.json"

            VIDEO_ID=$(python -c "import json; print(json.load(open('${LATEST_DIR}youtube_upload_result.json'))['video_id'])" 2>/dev/null || echo "Unknown")
            echo "VIDEO_ID=$VIDEO_ID" >> $GITHUB_OUTPUT
            echo "YOUTUBE_URL=https://www.youtube.com/watch?v=$VIDEO_ID" >> $GITHUB_OUTPUT
            echo "upload_success=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Upload result file not found - upload may have failed"
            echo "VIDEO_ID=Unknown" >> $GITHUB_OUTPUT
            echo "YOUTUBE_URL=Unknown" >> $GITHUB_OUTPUT
            echo "upload_success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_ACTIONS: "true"

      - name: 📤 Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-fluency-podcast-${{ github.run_number }}
          path: |
            ${{ steps.generate.outputs.LATEST_PODCAST_DIR }}podcast_30min_final.mp4
            ${{ steps.generate.outputs.LATEST_PODCAST_DIR }}thumbnail_*.png
            ${{ steps.generate.outputs.LATEST_PODCAST_DIR }}youtube_metadata.json
            ${{ steps.generate.outputs.LATEST_PODCAST_DIR }}script.json
          retention-days: 7

      - name: 📊 Upload Summary Comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const duration = process.env.VIDEO_DURATION || 'Unknown';
            const videoId = '${{ steps.youtube-upload.outputs.VIDEO_ID }}' || 'Not uploaded yet';
            const youtubeUrl = '${{ steps.youtube-upload.outputs.YOUTUBE_URL }}' || 'Check workflow run for details';
            const uploadSuccess = '${{ steps.youtube-upload.outputs.upload_success }}' === 'true';

            if (uploadSuccess) {
              const message = [
                '## ✅ English Fluency Studio Podcast Generated & Uploaded!',
                '',
                '| Property | Value |',
                '|----------|-------|',
                `| Duration | ${duration} seconds |`,
                `| Video ID | ${videoId} |`,
                `| YouTube URL | ${youtubeUrl} |`,
                '| Status | 🟢 Automatically uploaded to YouTube |',
                '',
                '### 📥 Download Backup',
                '1. Go to **Actions** tab',
                '2. Click on this workflow run',
                '3. Scroll to **Artifacts** section',
                `4. Download \`english-fluency-podcast-${{ github.run_number }}\``,
                '',
                '### 📺 YouTube Upload Details',
                '- ✅ Video automatically uploaded to YouTube',
                '- ✅ Thumbnail uploaded',
                '- ✅ Title, description, and tags included',
                '- 🟢 Video is **PUBLIC** (visible to everyone)',
              ].join('\n');
              console.log(message);
            } else {
              const message = [
                '## ⚠️ Podcast Generated (Upload Failed)',
                '',
                '| Property | Value |',
                '|----------|-------|',
                `| Duration | ${duration} seconds |`,
                '| Status | 🟡 Video generated but upload failed |',
                '',
                '### 📥 Download and Manual Upload Required',
                '1. Go to **Actions** tab',
                '2. Click on this workflow run',
                '3. Scroll to **Artifacts** section',
                `4. Download \`english-fluency-podcast-${{ github.run_number }}\``,
                '5. Extract and manually upload to YouTube',
              ].join('\n');
              console.log(message);
            }
