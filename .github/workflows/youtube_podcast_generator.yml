name: English Fluency Studio - Daily Podcast Generator

on:
  schedule:
    - cron: '0 3 * * *'

  workflow_dispatch:
    inputs:
      upload_youtube:
        description: 'Upload to YouTube? (auto = alternate days, true = force upload, false = skip)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - 'true'
          - 'false'
      topic:
        description: 'Topic index (0-9, optional)'
        required: false
        default: ''
      turns:
        description: 'Dialogue turns (default: 170)'
        required: false
        default: '170'

permissions:
  contents: write

jobs:
  generate-podcast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-freefont-ttf
          sudo fc-cache -fv

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file from secrets
        run: |
          echo "POLLINATIONS_API_KEY=${{ secrets.POLLINATIONS_API_KEY }}" >> .env
          echo "AI_MODEL=${{ secrets.AI_MODEL || 'gemini-fast' }}" >> .env
          echo "YT_CLIENT_ID=${{ secrets.YT_CLIENT_ID }}" >> .env
          echo "YT_CLIENT_SECRET=${{ secrets.YT_CLIENT_SECRET }}" >> .env
          echo "YT_REFRESH_TOKEN=${{ secrets.YT_REFRESH_TOKEN }}" >> .env

      - name: Generate 30-Minute Podcast Video
        id: generate
        run: |
          echo "Starting podcast generation..."

          TOPIC_ARG=""
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            TOPIC_ARG="topic_index=${{ github.event.inputs.topic }},"
          fi
          TURNS="${{ github.event.inputs.turns || '170' }}"

          python -c "
          import asyncio
          from podcast_generator import run_full_generator
          asyncio.run(run_full_generator(${TOPIC_ARG} custom_turns=${TURNS}))
          "

          LATEST_DIR=$(ls -td output/run_*/ | head -1)
          echo "LATEST_PODCAST_DIR=$LATEST_DIR" >> $GITHUB_OUTPUT

      - name: 📅 Check YouTube upload schedule (Alternate days)
        id: yt_schedule
        run: |
          INPUT_CHOICE="${{ github.event.inputs.upload_youtube }}"
          if [ "$INPUT_CHOICE" = "true" ]; then
            echo "should_upload=true" >> "$GITHUB_OUTPUT"
            echo "Manual override: YouTube upload forced to TRUE."
          elif [ "$INPUT_CHOICE" = "false" ]; then
            echo "should_upload=false" >> "$GITHUB_OUTPUT"
            echo "Manual override: YouTube upload forced to FALSE."
          else
            # Alternate-day schedule based on UTC Day of the Year
            # Odd days (e.g. 283, 285...) = Upload to YouTube
            # Even days (e.g. 284, 286...) = Skip YouTube (1-day gap)
            DAY_OF_YEAR=$(date -u +%-j)
            echo "Current UTC Day of Year: $DAY_OF_YEAR"
            if [ $(( 10#$DAY_OF_YEAR % 2 )) -ne 0 ]; then
              echo "should_upload=true" >> "$GITHUB_OUTPUT"
              echo "✅ Today is a scheduled YouTube upload day (Day $DAY_OF_YEAR)."
            else
              echo "should_upload=false" >> "$GITHUB_OUTPUT"
              echo "⏸️ Today is an alternate off-day for YouTube (Day $DAY_OF_YEAR). Skipping YouTube upload (Facebook will still upload)."
            fi
          fi

      - name: Upload to YouTube
        id: youtube-upload
        if: steps.yt_schedule.outputs.should_upload == 'true'
        continue-on-error: true
        run: |
          LATEST_DIR="${{ steps.generate.outputs.LATEST_PODCAST_DIR }}"

          if [ ! -f "${LATEST_DIR}podcast_30min_final.mp4" ]; then
            echo "Video file not found"
            exit 1
          fi

          export YT_CLIENT_ID="${{ secrets.YT_CLIENT_ID }}"
          export YT_CLIENT_SECRET="${{ secrets.YT_CLIENT_SECRET }}"
          export YT_REFRESH_TOKEN="${{ secrets.YT_REFRESH_TOKEN }}"
          export PYTHONPATH="${{ github.workspace }}/upload:$PYTHONPATH"

          cd upload
          python upload_youtube_longform.py

          if [ -f "${LATEST_DIR}youtube_upload_result.json" ]; then
            VIDEO_ID=$(python -c "import json; print(json.load(open('${LATEST_DIR}youtube_upload_result.json'))['video_id'])" 2>/dev/null || echo "Unknown")
            echo "VIDEO_ID=$VIDEO_ID" >> $GITHUB_OUTPUT
          fi
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_ACTIONS: "true"

      - name: Upload to Facebook
        id: facebook-upload
        continue-on-error: true
        run: |
          LATEST_DIR="${{ steps.generate.outputs.LATEST_PODCAST_DIR }}"

          if [ ! -f "${LATEST_DIR}podcast_30min_final.mp4" ]; then
            echo "Video file not found"
            exit 1
          fi

          python publish_facebook.py "${LATEST_DIR}podcast_30min_final.mp4" "${LATEST_DIR}youtube_metadata.json"
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          GITHUB_ACTIONS: "true"

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-fluency-podcast-${{ github.run_number }}
          path: |
            ${{ steps.generate.outputs.LATEST_PODCAST_DIR }}podcast_30min_final.mp4
            ${{ steps.generate.outputs.LATEST_PODCAST_DIR }}thumbnail_*.png
            ${{ steps.generate.outputs.LATEST_PODCAST_DIR }}youtube_metadata.json
            ${{ steps.generate.outputs.LATEST_PODCAST_DIR }}facebook_upload_result.json
          retention-days: 7

      - name: Commit published history log
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add published_history.json
          if git diff --staged --quiet; then
            echo "No changes to published_history.json to commit."
          else
            git commit -m "chore: update published history log [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
